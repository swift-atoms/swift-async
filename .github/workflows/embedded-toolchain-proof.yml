name: Embedded toolchain proof

on:
  push:
    branches:
      - research/embedded-concurrency-proof

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    container: swiftlang/swift@sha256:3ae5234721c87bda6ab232a2346fc143ac5688159626c8800e66a5eef2a31a16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Record subject and toolchain
        run: |
          swift --version
          git -c safe.directory="$PWD" rev-parse HEAD

      - name: Prove explicit Concurrency import exposes AsyncSequence
        run: |
          cat > /tmp/Concurrency.swift <<'SWIFT'
          import _Concurrency

          func consume<Values: AsyncSequence>(_ values: Values) async rethrows {
              for try await _ in values {}
          }
          SWIFT
          swiftc -c /tmp/Concurrency.swift \
            -wmo \
            -warnings-as-errors \
            -enable-experimental-feature Embedded \
            -o /tmp/Concurrency.o

      - name: Prove complete key paths
        run: |
          cat > /tmp/KeyPath.swift <<'SWIFT'
          struct Point {
              var x: Int
          }

          func x(of point: Point) -> Int {
              point[keyPath: \Point.x]
          }
          SWIFT
          swiftc -c /tmp/KeyPath.swift \
            -wmo \
            -warnings-as-errors \
            -enable-experimental-feature Embedded \
            -o /tmp/KeyPath.o

      - name: Show generic dispatch through an existential remains rejected
        run: |
          cat > /tmp/Existential.swift <<'SWIFT'
          protocol Sink {
              func accept<Value>(_ value: Value)
          }

          struct Box: Sink {
              func accept<Value>(_ value: Value) {}
          }

          func use(_ sink: any Sink) {
              sink.accept(1)
          }
          SWIFT
          if swiftc -c /tmp/Existential.swift \
            -wmo \
            -warnings-as-errors \
            -enable-experimental-feature Embedded \
            -o /tmp/Existential.o
          then
            echo 'Expected generic dispatch through an existential to be rejected.' >&2
            exit 1
          fi

      - name: Prove generic source dispatch specializes
        run: |
          cat > /tmp/Generic.swift <<'SWIFT'
          protocol Sink {
              func accept<Value>(_ value: Value)
          }

          struct Box: Sink {
              func accept<Value>(_ value: Value) {}
          }

          func use<SinkValue: Sink>(_ sink: SinkValue) {
              sink.accept(1)
          }
          SWIFT
          swiftc -c /tmp/Generic.swift \
            -wmo \
            -warnings-as-errors \
            -enable-experimental-feature Embedded \
            -o /tmp/Generic.o

      - name: Prove Embedded diagnostics require a static message
        run: |
          cat > /tmp/DynamicMessage.swift <<'SWIFT'
          func fail(_ value: Int) -> Never {
              preconditionFailure("Invariant violated: \(value)")
          }
          SWIFT
          if swiftc -c /tmp/DynamicMessage.swift \
            -wmo \
            -warnings-as-errors \
            -enable-experimental-feature Embedded \
            -o /tmp/DynamicMessage.o
          then
            echo 'Expected an interpolated diagnostic message to be rejected.' >&2
            exit 1
          fi

          cat > /tmp/StaticMessage.swift <<'SWIFT'
          func fail(_ value: Int) -> Never {
              preconditionFailure("Invariant violated")
          }
          SWIFT
          swiftc -c /tmp/StaticMessage.swift \
            -wmo \
            -warnings-as-errors \
            -enable-experimental-feature Embedded \
            -o /tmp/StaticMessage.o

      - name: Build the package with the fleet flags
        run: |
          swift build \
            -Xswiftc -enable-experimental-feature -Xswiftc Embedded

  foundation-free-target:
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: swift-atoms/swift-renderer
            ref: fc708f05d8b289b3ff8f6646554d922da5da2480
            target: Renderer
          - repository: swift-atoms/swift-system
            ref: 9262438be6e94996a9f26493347c064b3a7c5ef2
            target: System Standard Library Integration
          - repository: swift-molecules/swift-range
            ref: 1c50bef5b9179d6eef569e3c9a23ee627bd2e567
            target: Range Standard Library Integration
          - repository: swift-molecules/swift-token
            ref: bb2e2dc389d20e7f59141906e47011394272ada2
            target: Token Standard Library Integration
    runs-on: ubuntu-latest
    container: swiftlang/swift@sha256:f577f95edfb85cf3bdc45eb0badaab09239de5c86c69b3b6d594cc62916c0a7d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          persist-credentials: false

      - name: Record subject and toolchain
        run: |
          swift --version
          git -c safe.directory="$PWD" rev-parse HEAD

      - name: Build the Foundation-free target with the fleet flags
        run: |
          swift build --target '${{ matrix.target }}' \
            -Xswiftc -enable-experimental-feature -Xswiftc Embedded

  rational-static-message:
    runs-on: ubuntu-latest
    container: swiftlang/swift@sha256:3ae5234721c87bda6ab232a2346fc143ac5688159626c8800e66a5eef2a31a16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: swift-atoms/swift-rational
          ref: b32b0628f5a90e8bf8bb4bb3991a3319853db7e0
          persist-credentials: false

      - name: Record subject and toolchain
        run: |
          swift --version
          git -c safe.directory="$PWD" rev-parse HEAD

      - name: Show the dynamic-message baseline fails
        run: |
          if swift build --target Rational \
            -Xswiftc -enable-experimental-feature -Xswiftc Embedded
          then
            echo 'Expected the dynamic diagnostic message baseline to fail.' >&2
            exit 1
          fi

      - name: Apply the StaticString source pattern
        run: |
          git -c safe.directory="$PWD" apply <<'PATCH'
          diff --git a/Sources/Rational/Rational.swift b/Sources/Rational/Rational.swift
          --- a/Sources/Rational/Rational.swift
          +++ b/Sources/Rational/Rational.swift
          @@ -52,5 +52,5 @@ public struct Rational<Integer: SignedInteger & Sendable>: Sendable {
                   return try body()
               } catch {
          -        preconditionFailure("Invariant violated: \(error)")
          +        preconditionFailure("Invariant violated")
               }
           }
          PATCH
          git -c safe.directory="$PWD" diff --check
          swift package clean
          swift build --target Rational \
            -Xswiftc -enable-experimental-feature -Xswiftc Embedded
